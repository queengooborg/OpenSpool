---
text_sensor:
  - platform: template
    name: "OpenSpool URL"
    id: openspool_url
    state_topic:
    icon: mdi:web
    web_server:
      sorting_group_id: sorting_group_extra
    lambda: |-
      std::string mac = id(mac_address).state;
      // Extract just the last 6 characters (3 pairs of hex digits)
      std::string last_6 = mac.substr(9, 2) + mac.substr(12, 2) + mac.substr(15, 2);
      return {"http://openspool-" + last_6 + ".local"};
  - platform: template
    name: "BambuHandy URL"
    id: bambuhandy_url
    state_topic:
    icon: mdi:cellphone
    web_server:
      sorting_group_id: sorting_group_extra
    lambda: |-
      return {"bambulab://"};

button:
  - platform: template
    name: "OpenSpool Create Tag"
    id: write_url_button
    state_topic:
    icon: mdi:web
    web_server:
      sorting_group_id: sorting_group_extra
    on_press:
      then:
        # TODO: binary sensor that shows reader write_mode? 
        # TODO: blink lights when light mode changes
        - logger.log: "Writing tag" #TODO: change log namespace
        - lambda: "// This causes esp32 to lockup, stackoverflow perhaps? \n// Leaving this code here as an example of what not to do\n#magic___^_^___line\n// std::string url = id(openspool_url).state;\n// nfc::NdefMessage message;\n// message.add_uri_record(url);\n//id(rfid_reader_spi_0).write_mode(&message);\n#magic___^_^___line\n// This also causes it to lockup\n#magic___^_^___line\n// std::string url = id(openspool_url).state;\n// auto message = std::make_unique<nfc::NdefMessage>();\n// message->add_uri_record(url);\n// id(rfid_reader_spi_0).write_mode(message.get());\n#magic___^_^___line\n// deleting the message also causes a lockup\n#magic___^_^___line\n// std::string url = id(openspool_url).state;\n// auto message = new nfc::NdefMessage();\n// message->add_uri_record(url);\n// id(rfid_reader_spi_0).write_mode(message);\n// delete message; \n#magic___^_^___line\n// even though it seems wrong to use 'new' without a 'delete'\n// this is the only code that doesn't crash. \nstd::string url = id(openspool_url).state;\nESP_LOGD(\"NFC\", \"Writing URL: %s\", url.c_str());\nauto message = new nfc::NdefMessage();\nmessage->add_uri_record(url);\nid(rfid_reader_spi_0).write_mode(message);"
        - wait_until:
            not:
              pn532.is_writing:
                id: rfid_reader_spi_0
        - logger.log: "Finished writing tag" #TODO: change log namespace
  - platform: template
    name: "BambuHandy Create Tag"
    id: write_bambuhandy_url_button
    state_topic:
    icon: mdi:cellphone
    web_server:
      sorting_group_id: sorting_group_extra
    on_press:
      then:
        # TODO: binary sensor that shows reader write_mode? 
        # TODO: blink lights when light mode changes
        - logger.log: "Writing tag" #TODO: change log namespace
        - lambda: |-
            std::string url = id(bambuhandy_url).state;
            ESP_LOGD("NFC", "Writing URL: %s", url.c_str());
            auto message = new nfc::NdefMessage();
            message->add_uri_record(url);
            id(rfid_reader_spi_0).write_mode(message);
        - wait_until:
            not:
              pn532.is_writing:
                id: rfid_reader_spi_0
        - logger.log: "Finished writing tag" #TODO: change log namespace   
